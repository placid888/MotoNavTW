steps:
  # 1. 抓取你的最新程式碼
  - name: Checkout Repository
    uses: actions/checkout@v4

  # 2. 安裝 Java 17 環境 (Android Studio 預設編譯環境)
  - name: Setup Java JDK
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'
      cache: gradle

  # 3. 給予 Gradle 執行權限 (避免 Linux 權限問題)
  - name: Grant execute permission for gradlew
    run: chmod +x gradlew

  # 4. 執行編譯指令！這等同於你在 Android Studio 按下 Run
  - name: Build Debug APK
    run: ./gradlew assembleDebug

  # 5. 將編譯好的 APK 上傳，讓你可以在網頁上下載
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MotoNavTW-Debug-APK
      # 這是 Android Studio 預設產出 APK 的路徑
      path: app/build/outputs/apk/debug/app-debug.apk